<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Video Library</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0f172a; padding: 20px; color: white; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 15px; margin-bottom: 30px; border: 1px solid #334155; }
        #linksList { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        .video-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px; text-align: center; transition: all 0.3s ease; overflow: hidden; }
        .video-card:hover { transform: translateY(-5px); border-color: #38bdf8; }
        
        .thumbnail-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; margin-bottom: 10px; overflow: hidden; position: relative; cursor: pointer; }
        .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; }
        .play-overlay-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; color: rgba(255,255,255,0.8); background: rgba(56, 189, 248, 0.6); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .video-title { font-size: 15px; font-weight: 600; color: #f1f5f9; margin-bottom: 10px; }
        .download-btn { background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* اوورلے پاپ اپ */
        #contentModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        
        /* کلوز بٹن کا نیا اسٹائل */
        .close-container { width: 100%; max-width: 900px; display: flex; justify-content: flex-end; padding-bottom: 10px; }
        .close-btn { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

        .modal-content { width: 95%; height: 80%; max-width: 900px; background: #fff; border-radius: 10px; overflow: hidden; position: relative; }
        #contentFrame { width: 100%; height: 100%; border: none; }

        /* ایڈ ماڈل */
        #adModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; }
        #adFrame { width: 100%; height: 100%; border: none; }
        #timerOverlay { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 50px; font-weight: bold; z-index: 2001; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>B Videos</h1>
        <p>Watch or Download high quality videos</p>
    </div>
    <div id="linksList"></div>
</div>

<div id="contentModal">
    <div class="close-container">
        <button class="close-btn" onclick="closeModal()">CLOSE ✕</button>
    </div>
    <div class="modal-content">
        <iframe id="contentFrame" src=""></iframe>
    </div>
</div>

<div id="adModal">
    <div id="timerOverlay">Please wait: <span id="seconds">15</span>s</div>
    <iframe id="adFrame" src=""></iframe>
</div>

<script>
const videoData = [
    { 
        url: "https://u.pcloud.link/publink/show?code=XZRWe65ZWHI296lekNf1UGviq7GW1kXSWmvy", 
        thumb: "https://icdn05.boy18tube.com/78530/3926496_14.webp" 
    },
];

const adLinks = [
    "https://www.effectivegatecpm.com/fgjvc6xp?key=02a55463acca337410ce3bf28d4c13fa",
    "https://www.effectivegatecpm.com/etnvcsg5?key=8cdf22590b8d8a5148ae31d2551bbe25"
];

let playCounter = 0;

document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('linksList');
    videoData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
            <div class="thumbnail-container" onclick="handleLinkClick('${item.url}')">
                <img src="${item.thumb}" alt="Thumbnail">
                <div class="play-overlay-icon">▶</div>
            </div>
            <div class="video-title">Video ${index + 1}</div>
            <button class="download-btn" onclick="startDownloadProcess('${item.url}')">
                📥 Download
            </button>
        `;
        container.appendChild(card);
    });

    setInterval(() => {
        const randomAd = adLinks[Math.floor(Math.random() * adLinks.length)];
        showAdModal(randomAd);
    }, 180000);
});

function handleLinkClick(url) {
    playCounter++;
    if (playCounter % 7 === 0) {
        const randomAd = adLinks[Math.floor(Math.random() * adLinks.length)];
        showAdModal(randomAd, () => openInOverlay(url));
    } else {
        openInOverlay(url);
    }
}

function openInOverlay(url) {
    const modal = document.getElementById('contentModal');
    const frame = document.getElementById('contentFrame');
    frame.src = url;
    modal.style.display = 'flex';
}

function closeModal() {
    const modal = document.getElementById('contentModal');
    const frame = document.getElementById('contentFrame');
    modal.style.display = 'none';
    frame.src = "";
}

function startDownloadProcess(url) {
    const randomAd = adLinks[Math.floor(Math.random() * adLinks.length)];
    showAdModal(randomAd, () => triggerDownload(url));
}

function showAdModal(adUrl, callback) {
    const adModal = document.getElementById('adModal');
    const adFrame = document.getElementById('adFrame');
    const secondsSpan = document.getElementById('seconds');
    
    adFrame.src = adUrl;
    adModal.style.display = 'block';
    
    let timeLeft = 20;
    secondsSpan.innerText = timeLeft;

    const timer = setInterval(() => {
        timeLeft--;
        secondsSpan.innerText = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(timer);
            adModal.style.display = 'none';
            adFrame.src = "";
            if (callback) callback();
        }
    }, 1000);
}

function triggerDownload(url) {
    window.open(url, '_blank');
}
</script>
</body>
</html>
